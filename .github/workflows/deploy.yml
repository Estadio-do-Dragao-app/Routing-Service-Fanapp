name: Deploy to VM
on:
  push:
    branches: [ "main", "dev" ]
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Update Service
        run: |
          cd ~/PEI/Routing-Service-Fanapp
          git pull origin ${{ github.ref_name }} --rebase
          cd ..
          docker compose up -d --build routing-service